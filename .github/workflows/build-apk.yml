name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p app/src/main/java/c/m app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          echo 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}};dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}};include ":app"' > settings.gradle
          echo 'plugins{id "com.android.application" version "8.2.2" apply false;id "org.jetbrains.kotlin.android" version "1.9.22" apply false}' > build.gradle
          echo 'android.useAndroidX=true' > gradle.properties
          echo 'plugins{id "com.android.application";id "org.jetbrains.kotlin.android"};android{namespace "c.m";compileSdk 34;defaultConfig{applicationId "com.example.matrix3dvol";minSdk 26;targetSdk 34;versionCode 2;versionName "1.1"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget="17"}};dependencies{implementation "androidx.core:core-ktx:1.12.0"}' > app/build.gradle
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com">
              <uses-feature android:name="android.software.live_wallpaper" android:required="true"/>
              <application android:hardwareAccelerated="true" android:icon="@drawable/ic" android:label="@string/n">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".W" android:enabled="true" android:exported="true" android:label="@string/n" android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService"/>
                      </intent-filter>
                      <meta-data android:name="android.service.wallpaper" android:resource="@xml/w"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/res/xml/w.xml
          <wallpaper xmlns:android="http://android.com" android:settingsActivity="c.m.MainActivity" android:thumbnail="@drawable/ic"/>
          EOF
          echo '<resources><string name="n">Matrix 3D Volumetric</string></resources>' > app/src/main/res/values/strings.xml
          python3 -c 'import zlib,struct;c=lambda t,b:struct.pack("!I",len(b))+t+b+struct.pack("!I",zlib.crc32(t+b)&0xffffffff);open("app/src/main/res/drawable/ic.png","wb").write(b"\x89PNG\r\n\x1a\n"+c(b"IHDR",struct.pack("!IIBBBBB",32,32,8,6,0,0,0))+c(b"IDAT",zlib.compress(b"".join(b"\x00"+b"\x00\xff\x55\xff"*32 for _ in range(32))))+c(b"IEND",b""))'
          cat << 'EOF' > app/src/main/java/c/m/MainActivity.kt
          package c.m
          import android.app.*;import android.content.*;import android.graphics.*;import android.os.Bundle;import android.widget.*
          class MainActivity:Activity(){override fun onCreate(b:Bundle?){super.onCreate(b);val p=getSharedPreferences("m",0);val r=LinearLayout(this).apply{orientation=1;setBackgroundColor(Color.BLACK);setPadding(56,90,56,64)};fun l(s:String)=TextView(this).apply{text=s;setTextColor(Color.GREEN);typeface=Typeface.MONOSPACE};val th=arrayOf("GREEN","CYAN","RED","GOLD","PURPLE","PRISM");val b1=Button(this).apply{text="THEME: ${th[p.getInt("th",0)%6]}";setOnClickListener{val n=(p.getInt("th",0)+1)%6;p.edit().putInt("th",n).apply();text="THEME: ${th[n]}"}};val s1=SeekBar(this).apply{max=28;progress=p.getInt("sp",12)-2;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){p.edit().putInt("sp",v+2).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})};val s2=SeekBar(this).apply{max=48;progress=p.getInt("sz",42)-20;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){p.edit().putInt("sz",v+20).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})};val s3=SeekBar(this).apply{max=60;progress=p.getInt("dn",45)-15;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){p.edit().putInt("dn",v+15).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})};val btn=Button(this).apply{text="SET 3D WALLPAPER";setBackgroundColor(Color.GREEN);setOnClickListener{try{startActivity(Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,ComponentName(this@MainActivity,W::class.java)))}catch(e:Exception){startActivity(Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER))}}};r.addView(b1);r.addView(l("FALL SPEED"));r.addView(s1);r.addView(l("3D GLYPH SCALE"));r.addView(s2);r.addView(l("COLUMN DENSITY"));r.addView(s3);r.addView(btn);setContentView(r)}}
          EOF
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: gradle assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          name: Matrix 3D Volumetric v1.1
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
