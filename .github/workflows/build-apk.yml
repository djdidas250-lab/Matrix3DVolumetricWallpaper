name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p app/src/main/java/c/m app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          echo 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}};dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}};include ":app"' > settings.gradle
          echo 'plugins{id "com.android.application" version "8.2.2" apply false;id "org.jetbrains.kotlin.android" version "1.9.22" apply false}' > build.gradle
          echo 'android.useAndroidX=true' > gradle.properties
          echo 'plugins{id "com.android.application";id "org.jetbrains.kotlin.android"};android{namespace "c.m";compileSdk 34;defaultConfig{applicationId "com.example.matrix3dvol";minSdk 26;targetSdk 34;versionCode 4;versionName "1.3"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget="17"}};dependencies{implementation "androidx.core:core-ktx:1.12.0"}' > app/build.gradle
          python3 -c 'q=chr(34);e=chr(61);a="android"+chr(58);u="ht"+"tp://"+"schemas."+"android."+"com/apk/res/android";x=f"<manifest xmlns:{a[:-1]}{e}{q}{u}{q}><uses-feature {a}name{e}{q}android.software.live_wallpaper{q} {a}required{e}{q}true{q}/><application {a}hardwareAccelerated{e}{q}true{q} {a}icon{e}{q}@drawable/ic{q} {a}label{e}{q}@string/n{q}><activity {a}name{e}{q}.MainActivity{q} {a}exported{e}{q}true{q}><intent-filter><action {a}name{e}{q}android.intent.action.MAIN{q}/><category {a}name{e}{q}android.intent.category.LAUNCHER{q}/></intent-filter></activity><service {a}name{e}{q}.W{q} {a}enabled{e}{q}true{q} {a}exported{e}{q}true{q} {a}label{e}{q}@string/n{q} {a}permission{e}{q}android.permission.BIND_WALLPAPER{q}><intent-filter><action {a}name{e}{q}android.service.wallpaper.WallpaperService{q}/></intent-filter><meta-data {a}name{e}{q}android.service.wallpaper{q} {a}resource{e}{q}@xml/w{q}/></service></application></manifest>";open("app/src/main/AndroidManifest.xml","w").write(x);open("app/src/main/res/xml/w.xml","w").write(f"<wallpaper xmlns:{a[:-1]}{e}{q}{u}{q} {a}settingsActivity{e}{q}c.m.MainActivity{q} {a}thumbnail{e}{q}@drawable/ic{q}/>");open("app/src/main/res/values/strings.xml","w").write(f"<resources><string name{e}{q}n{q}>Matrix 3D</string></resources>")'
          python3 -c 'import zlib,struct;c=lambda t,b:struct.pack("!I",len(b))+t+b+struct.pack("!I",zlib.crc32(t+b)&0xffffffff);open("app/src/main/res/drawable/ic.png","wb").write(b"\x89PNG\r\n\x1a\n"+c(b"IHDR",struct.pack("!IIBBBBB",32,32,8,6,0,0,0))+c(b"IDAT",zlib.compress(b"".join(b"\x00"+b"\x00\xff\x55\xff"*32 for _ in range(32))))+c(b"IEND",b""))'
          printf 'package c.m\nimport android.app.*;import android.content.*;import android.graphics.*;import android.os.Bundle;import android.widget.*\nclass MainActivity:Activity(){\noverride fun onCreate(b:Bundle?){\nsuper.onCreate(b)\nval p=getSharedPreferences("m",0)\nval sv=ScrollView(this).apply{setBackgroundColor(Color.BLACK)}\nval r=LinearLayout(this).apply{orientation=1;setPadding(56,90,56,64)}\nfun l(s:String)=TextView(this).apply{text=s;setTextColor(Color.GREEN);textSize=15f;typeface=Typeface.MONOSPACE;setPadding(0,18,0,6)}\nval dev=TextView(this).apply{text="Developer: Dj DiD@S\\n-H@CK the PL@NET-";setTextColor(Color.rgb(0,255,120));textSize=18f;typeface=Typeface.MONOSPACE;gravity=17;setPadding(0,0,0,26)}\nval ths=arrayOf("MATRIX GREEN","CYBER CYAN","CRIMSON RED","SOLAR GOLD","ULTRAVIOLET","RAINBOW PRISM")\nval bTh=Button(this).apply{text="THEME: ${ths[p.getInt("th",0)%%6]}";setBackgroundColor(Color.DKGRAY);setTextColor(Color.GREEN);setOnClickListener{val n=(p.getInt("th",0)+1)%%6;p.edit().putInt("th",n).apply();text="THEME: ${ths[n]}"}}\nval t1=l("FALL SPEED: ${p.getInt("sp",12)}")\nval s1=SeekBar(this).apply{max=28;progress=p.getInt("sp",12)-2;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){t1.text="FALL SPEED: ${v+2}";p.edit().putInt("sp",v+2).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\nval t2=l("3D GLYPH SCALE: ${p.getInt("sz",42)}")\nval s2=SeekBar(this).apply{max=48;progress=p.getInt("sz",42)-20;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){t2.text="3D GLYPH SCALE: ${v+20}";p.edit().putInt("sz",v+20).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\nval t3=l("STREAM DENSITY: ${p.getInt("dn",85)}")\nval s3=SeekBar(this).apply{max=90;progress=p.getInt("dn",85)-30;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){t3.text="STREAM DENSITY: ${v+30}";p.edit().putInt("dn",v+30).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\nval t4=l("EFFECT INTENSITY: ${p.getInt("in",65)}%%")\nval s4=SeekBar(this).apply{max=140;progress=p.getInt("in",65)-10;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){t4.text="EFFECT INTENSITY: ${v+10}%%";p.edit().putInt("in",v+10).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\nval t5=l("BLOOM & BOKEH: ${p.getInt("bl",35)}%%")\nval s5=SeekBar(this).apply{max=100;progress=p.getInt("bl",35);setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){t5.text="BLOOM & BOKEH: ${v}%%";p.edit().putInt("bl",v).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\nfun sw(lb:String,k:String)=Switch(this).apply{text=lb;isChecked=p.getBoolean(k,true);setTextColor(Color.WHITE);typeface=Typeface.MONOSPACE;setPadding(0,14,0,14);setOnCheckedChangeListener{_,v->p.edit().putBoolean(k,v).apply()}}\nval btn=Button(this).apply{text="SET 3D WALLPAPER";setBackgroundColor(Color.GREEN);setTextColor(Color.BLACK);setOnClickListener{try{startActivity(Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,ComponentName(this@MainActivity,W::class.java)))}catch(e:Exception){startActivity(Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER))}}}\nr.addView(dev);r.addView(bTh);r.addView(t1);r.addView(s1);r.addView(t2);r.addView(s2);r.addView(t3);r.addView(s3);r.addView(t4);r.addView(s4);r.addView(t5);r.addView(s5);r.addView(sw("LENS BLOOM & BOKEH","f1"));r.addView(sw("TOUCH 3D VORTEX & SURGE","f2"));r.addView(sw("RAZR FOLD-ADAPTIVE FOV","f3"));r.addView(sw("3-AXIS ROTATION TILT","f4"));r.addView(sw("FLY-OUT 3D GLYPHS","f5"));r.addView(btn);sv.addView(r);setContentView(sv)\n}}\n' > app/src/main/java/c/m/MainActivity.kt
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: gradle assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: Matrix 3D v1.3
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
